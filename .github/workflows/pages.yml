name: Test and publish game

on:
  push:
    branches: [yolo]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31.11.5
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Run the complete Nix gate and build
        run: ./test
      - name: Prepare tested static output
        run: mkdir _site && cp -rL result/. _site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy tested game
        id: deployment
        uses: actions/deploy-pages@v4
